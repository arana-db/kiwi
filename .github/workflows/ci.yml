name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short

jobs:
  planning-docs:
    name: planning SDD validation
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate failure paths
        run: python3 scripts/validate_sdd.py --self-test

      - name: Validate SDD control plane
        run: python3 scripts/validate_sdd.py

  license-check:
    name: license header check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: check license header
        uses: apache/skywalking-eyes/header@main

  # Format check only needs one OS — rustfmt output is platform-independent
  format:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - name: Check formatting
        run: make fmt-check

  cargo-clippy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
          - os: windows-latest
    name: cargo clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Test development compiler caching
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/tests/test-dev-sccache-env.sh

      - name: Free disk space (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/local/.ghcup /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        shell: bash

      - name: Configure C/C++ compiler caching
        if: matrix.os != 'windows-latest'
        run: |
          echo "CC=sccache cc" >> $GITHUB_ENV
          echo "CXX=sccache c++" >> $GITHUB_ENV
        shell: bash

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-

      - name: Install protoc (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install protobuf

      - name: Install protoc (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $protocVersion = "27.1"
          $protocZip = "protoc-$protocVersion-win64.zip"
          $protocUrl = "https://github.com/protocolbuffers/protobuf/releases/download/v$protocVersion/$protocZip"
          $protocPath = "$env:RUNNER_TEMP\protoc"
          Invoke-WebRequest -Uri $protocUrl -OutFile "$env:RUNNER_TEMP\$protocZip"
          Expand-Archive -Path "$env:RUNNER_TEMP\$protocZip" -DestinationPath $protocPath
          echo "$protocPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: make lint

      - name: Lint runtime baseline tool targets
        run: cargo clippy -p runtime-baseline --all-targets -- -D warnings -D clippy::unwrap_used

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
          - os: windows-latest
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/local/.ghcup /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        shell: bash

      - name: Configure C/C++ compiler caching
        if: matrix.os != 'windows-latest'
        run: |
          echo "CC=sccache cc" >> $GITHUB_ENV
          echo "CXX=sccache c++" >> $GITHUB_ENV
        shell: bash

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install protoc (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install protobuf

      - name: Install protoc (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $protocVersion = "27.1"
          $protocZip = "protoc-$protocVersion-win64.zip"
          $protocUrl = "https://github.com/protocolbuffers/protobuf/releases/download/v$protocVersion/$protocZip"
          $protocPath = "$env:RUNNER_TEMP\protoc"
          Invoke-WebRequest -Uri $protocUrl -OutFile "$env:RUNNER_TEMP\$protocZip"
          Expand-Archive -Path "$env:RUNNER_TEMP\$protocZip" -DestinationPath $protocPath
          echo "$protocPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        run: make build

      - name: Build runtime baseline tool
        run: cargo build -p runtime-baseline --bin kiwi-runtime-baseline

      - name: Enable Oracle user namespace sandbox
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --mount --pid --fork true

      - name: Run Unit Test with retry
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 2
          command: bash -o pipefail -c "make test 2>&1 | tee cargo-test.log"

      - name: Test storage stats with fault injection
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p storage --features test-fault-injection --test storage_stats_test

      - name: Test runtime baseline tool
        run: cargo test -p runtime-baseline --all-targets

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          retention-days: 7
          path: |
            cargo-test.log

  # Integration tests (Python) only on ubuntu
  integration-test:
    name: integration test
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Build project
        run: make build

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: make -C tests install-deps

      - name: Run integration tests
        run: bash tests/run_python_integration.sh

  trusted-vector-differential:
    name: trusted Vector differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential protobuf-compiler python3-pip

      - name: Enable Oracle user namespace sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --mount --pid --fork true

      - name: Prepare callback Python dependencies
        run: |
          /usr/bin/python3 -m pip install --target .oracle-python \
            'pytest>=7.0.0' 'pytest-timeout>=2.1.0' 'redis>=5.0.0'

      - name: Prepare exact Redis 8.8.1 source
        run: |
          mkdir -p "$RUNNER_TEMP/kiwi-oracle"
          git clone --no-checkout https://github.com/redis/redis.git \
            "$RUNNER_TEMP/kiwi-oracle/redis-source"
          git -C "$RUNNER_TEMP/kiwi-oracle/redis-source" checkout --detach \
            77b6c308396c9700672390a210143a8496fb4b10

      - name: Run required trusted Vector differential
        run: |
          KIWI_COMPAT_REQUIRE_ORACLE=1 \
          KIWI_REDIS_ORACLE_SOURCE="$RUNNER_TEMP/kiwi-oracle/redis-source" \
          KIWI_REDIS_ORACLE_PRIMARY_METADATA="$RUNNER_TEMP/kiwi-oracle/primary-build.json" \
          KIWI_REDIS_ORACLE_OUTPUT="$RUNNER_TEMP/kiwi-oracle/oracle-provenance.json" \
            bash scripts/compat/run-vector-differential.sh

      - name: Upload trusted Oracle provenance
        uses: actions/upload-artifact@v7
        with:
          name: trusted-vector-oracle-provenance
          retention-days: 7
          path: ${{ runner.temp }}/kiwi-oracle/oracle-provenance.json
          if-no-files-found: error

  vector-cluster-fail-closed:
    name: Vector cluster fail-closed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install build and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential protobuf-compiler

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install cluster test dependencies
        run: python3 -m pip install 'pytest>=7.0.0' 'redis>=5.0.0'

      - name: Build current Head Kiwi
        run: cargo build --locked --bin kiwi

      - name: Prepare pinned grpcurl
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 \
            https://github.com/fullstorydev/grpcurl/releases/download/v1.9.3/grpcurl_1.9.3_linux_x86_64.tar.gz \
            -o "$RUNNER_TEMP/grpcurl.tar.gz"
          echo 'a926b62a85787ccf73ef8736b3ae554f1242e39d92bb8767a79d6dd23b11d1d5  grpcurl.tar.gz' \
            | (cd "$RUNNER_TEMP" && sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/grpcurl.tar.gz" -C "$RUNNER_TEMP" grpcurl

      - name: Run required three-node Vector cluster gate
        run: |
          KIWI_RUN_CLUSTER_TESTS=1 \
          KIWI_BINARY="$GITHUB_WORKSPACE/target/debug/kiwi" \
          KIWI_GRPCURL="$RUNNER_TEMP/grpcurl" \
            bash scripts/ci/run-vector-cluster.sh

  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    env:
      SANITIZER_TOOLCHAIN: nightly-2026-07-17
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, leak, thread]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust nightly with sanitizer support
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.SANITIZER_TOOLCHAIN }}
          components: |
            rust-src
            llvm-tools-preview

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler llvm

      - name: Enable Oracle user namespace sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --mount --pid --fork true

      - name: Run tests with ${{ matrix.sanitizer }} sanitizer
        env:
          RUSTFLAGS: "-Z sanitizer=${{ matrix.sanitizer }}"
          RUSTDOCFLAGS: "-Z sanitizer=${{ matrix.sanitizer }}"
          # Keep source locations in sanitizer backtraces. The repository-wide
          # default is optimized for normal CI logs, but an unsymbolized LSan
          # report cannot identify the leaking test/helper.
          CARGO_PROFILE_DEV_DEBUG: 2
          # AddressSanitizer enables leak detection by default. Leak checks run in
          # the dedicated leak sanitizer job, where third-party suppressions are
          # applied explicitly.
          ASAN_OPTIONS: "detect_leaks=0"
          LSAN_OPTIONS: "suppressions=${{ github.workspace }}/.github/lsan.supp"
          TSAN_OPTIONS: "suppressions=${{ github.workspace }}/.github/tsan.supp"
        run: |
          set -o pipefail
          sanitizer_sysroot="$(rustc +${SANITIZER_TOOLCHAIN} --print sysroot)"
          rust_llvm_symbolizer="$(find "$sanitizer_sysroot" -type f -name llvm-symbolizer -perm -111 -print -quit 2>/dev/null || true)"
          if [[ -n "$rust_llvm_symbolizer" ]]; then
            export ASAN_SYMBOLIZER_PATH="$rust_llvm_symbolizer"
          elif command -v llvm-symbolizer >/dev/null 2>&1; then
            export ASAN_SYMBOLIZER_PATH="$(command -v llvm-symbolizer)"
          fi
          if [[ -n "${ASAN_SYMBOLIZER_PATH:-}" ]]; then
            export LSAN_OPTIONS="${LSAN_OPTIONS}:external_symbolizer_path=${ASAN_SYMBOLIZER_PATH}:symbolize=1:malloc_context_size=50"
            echo "Using sanitizer symbolizer: $ASAN_SYMBOLIZER_PATH"
            "$ASAN_SYMBOLIZER_PATH" --version || true
          fi
          if [[ "${{ matrix.sanitizer }}" == "leak" ]]; then
            # Run the complete leak-sanitizer scope after the symbolized
            # diagnostic experiments; this is the final validation for the PR.
            cargo +${SANITIZER_TOOLCHAIN} test -Z build-std --target x86_64-unknown-linux-gnu \
              --workspace --exclude storage \
              -- --skip cursor_snapshot_roundtrip \
              --skip install_snapshot_with_existing_data \
              --skip install_snapshot_rearms_append_log_hook \
              --skip test_snapshot_with_logindex_state \
              --skip test_on_binlog_write_updates_collector \
              --skip test_collector_state_export_restore \
              --skip storage_command_e2e_ \
              2>&1 | tee sanitizer.log
            cargo +${SANITIZER_TOOLCHAIN} test -Z build-std --target x86_64-unknown-linux-gnu \
              -p storage --lib 2>&1 | tee -a sanitizer.log
          elif [[ "${{ matrix.sanitizer }}" == "thread" ]]; then
            # RocksDB/libstdc++ trigger sanitizer reports and timing instability
            # in storage integration test binaries. The net crate's end-to-end
            # storage command tests also spin up a real RocksDB-backed stack, so
            # skip them under LSan/TSan for the same reason. Keep LSan/TSan on
            # the rest of the workspace and storage unit tests; regular tests and
            # ASan still cover the RocksDB-backed integration tests.
            {
              cargo +${SANITIZER_TOOLCHAIN} test -Z build-std --target x86_64-unknown-linux-gnu \
                --workspace --exclude storage \
                -- --skip cursor_snapshot_roundtrip \
                --skip install_snapshot_with_existing_data \
                --skip install_snapshot_rearms_append_log_hook \
                --skip test_snapshot_with_logindex_state \
                --skip test_on_binlog_write_updates_collector \
                --skip test_collector_state_export_restore \
                --skip storage_command_e2e_
              cargo +${SANITIZER_TOOLCHAIN} test -Z build-std --target x86_64-unknown-linux-gnu \
                -p storage --lib
            } 2>&1 | tee sanitizer.log
          else
            cargo +${SANITIZER_TOOLCHAIN} test -Z build-std --target x86_64-unknown-linux-gnu 2>&1 | tee sanitizer.log
          fi

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sanitizer-${{ matrix.sanitizer }}-results
          retention-days: 7
          path: sanitizer.log

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: kiwi:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm kiwi:test kiwi --version

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Verify rkyv advisory remains unreachable
        run: bash scripts/ci/check-rkyv-reachability.sh

      - name: Security audit
        run: cargo audit
