      - tests/python/test_vector_set_differential.py::test_missing_key_semantics_match[resp3]
      - tests/python/test_vector_set_differential.py::test_vsim_missing_key_precedes_malformed_and_option_validation[resp2]
      - tests/python/test_vector_set_differential.py::test_vsim_missing_key_precedes_malformed_and_option_validation[resp3]
      - tests/python/test_vector_set_differential.py::test_vinfo_field_names_and_types_match[resp2]
      - tests/python/test_vector_set_differential.py::test_vinfo_field_names_and_types_match[resp3]
