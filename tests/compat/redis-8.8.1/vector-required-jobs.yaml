schema: kiwi-vector-required-jobs/v1
jobs:
  - job_id: trusted-vector-differential
    test_module: tests/python/test_vector_set_differential.py
    pytest_marker: raw_vector_protocol
    protocols: [resp2, resp3]
    commands: [VADD, VCARD, VDIM, VEMB, VINFO, VISMEMBER, VREM, VSIM]
    raw_cases:
      VADD:
        - case_id: zero-vector
          evidence_kind: exact-frame
          node_ids:
            - tests/python/test_vector_set_differential.py::test_zero_vector_values_raw_differential[resp2]
            - tests/python/test_vector_set_differential.py::test_zero_vector_values_raw_differential[resp3]
            - tests/python/test_vector_set_differential.py::test_zero_vector_fp32_raw_differential[resp2]
            - tests/python/test_vector_set_differential.py::test_zero_vector_fp32_raw_differential[resp3]
      VCARD:
        - case_id: zero-vector
          evidence_kind: exact-frame
          node_ids:
            - tests/python/test_vector_set_differential.py::test_zero_vector_values_raw_differential[resp2]
            - tests/python/test_vector_set_differential.py::test_zero_vector_values_raw_differential[resp3]
            - tests/python/test_vector_set_differential.py::test_zero_vector_fp32_raw_differential[resp2]
            - tests/python/test_vector_set_differential.py::test_zero_vector_fp32_raw_differential[resp3]
      VDIM:
        - case_id: zero-vector
          evidence_kind: exact-frame
          node_ids:
            - tests/python/test_vector_set_differential.py::test_zero_vector_values_raw_differential[resp2]
            - tests/python/test_vector_set_differential.py::test_zero_vector_values_raw_differential[resp3]
            - tests/python/test_vector_set_differential.py::test_zero_vector_fp32_raw_differential[resp2]
            - tests/python/test_vector_set_differential.py::test_zero_vector_fp32_raw_differential[resp3]
      VEMB:
        - case_id: zero-vector
          evidence_kind: exact-frame
          node_ids:
            - tests/python/test_vector_set_differential.py::test_zero_vector_values_raw_differential[resp2]
            - tests/python/test_vector_set_differential.py::test_zero_vector_values_raw_differential[resp3]
            - tests/python/test_vector_set_differential.py::test_zero_vector_fp32_raw_differential[resp2]
            - tests/python/test_vector_set_differential.py::test_zero_vector_fp32_raw_differential[resp3]
      VINFO:
        - case_id: missing-key
          evidence_kind: exact-frame
          node_ids:
            - tests/python/test_vector_set_differential.py::test_zero_vector_values_raw_differential[resp2]
            - tests/python/test_vector_set_differential.py::test_zero_vector_values_raw_differential[resp3]
            - tests/python/test_vector_set_differential.py::test_zero_vector_fp32_raw_differential[resp2]
            - tests/python/test_vector_set_differential.py::test_zero_vector_fp32_raw_differential[resp3]
        - case_id: populated
          evidence_kind: raw-schema
          node_ids:
            - tests/python/test_vector_set_differential.py::test_zero_vector_values_raw_differential[resp2]
            - tests/python/test_vector_set_differential.py::test_zero_vector_values_raw_differential[resp3]
            - tests/python/test_vector_set_differential.py::test_zero_vector_fp32_raw_differential[resp2]
            - tests/python/test_vector_set_differential.py::test_zero_vector_fp32_raw_differential[resp3]
      VISMEMBER:
        - case_id: zero-vector
          evidence_kind: exact-frame
          node_ids:
            - tests/python/test_vector_set_differential.py::test_zero_vector_values_raw_differential[resp2]
            - tests/python/test_vector_set_differential.py::test_zero_vector_values_raw_differential[resp3]
            - tests/python/test_vector_set_differential.py::test_zero_vector_fp32_raw_differential[resp2]
            - tests/python/test_vector_set_differential.py::test_zero_vector_fp32_raw_differential[resp3]
      VREM:
        - case_id: zero-vector
          evidence_kind: exact-frame
          node_ids:
            - tests/python/test_vector_set_differential.py::test_zero_vector_values_raw_differential[resp2]
            - tests/python/test_vector_set_differential.py::test_zero_vector_values_raw_differential[resp3]
            - tests/python/test_vector_set_differential.py::test_zero_vector_fp32_raw_differential[resp2]
            - tests/python/test_vector_set_differential.py::test_zero_vector_fp32_raw_differential[resp3]
      VSIM:
        - case_id: zero-vector
          evidence_kind: exact-frame
          node_ids:
            - tests/python/test_vector_set_differential.py::test_zero_vector_values_raw_differential[resp2]
            - tests/python/test_vector_set_differential.py::test_zero_vector_values_raw_differential[resp3]
